<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>noma estudio — administración</title>
<link rel="icon" href="../assets/img/logo/punto-azul.png">
</head>
<body>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", (user) => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
    // procesa el link de invitación/recuperación (#invite_token=... o #recovery_token=...)
    // y abre automáticamente el cartel para crear la contraseña.
    const hash = window.location.hash;
    if (hash && (hash.includes("invite_token") || hash.includes("recovery_token") || hash.includes("confirmation_token"))) {
      window.netlifyIdentity.open();
    }
  }
</script>
</body>
</html>
