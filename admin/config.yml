backend:
  name: git-gateway
  branch: main

# Carpeta donde se guardan las fotos que subís nuevas desde el panel.
# Si querés que una foto nueva quede ordenada junto a las de un proyecto,
# navegá dentro de la carpeta de ese proyecto antes de subirla.
media_folder: "assets/img/proyectos"
public_folder: "/assets/img/proyectos"

collections:
  - name: "projects"
    label: "Proyectos"
    files:
      - name: "projects"
        label: "Obras"
        file: "content/projects.json"
        fields:
          - label: "Obras"
            name: "projects"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "Nombre de la obra", name: "name", widget: "string", hint: "Como se muestra en el sitio, ej: mendoza"}
              - {label: "Identificador (slug)", name: "slug", widget: "string", hint: "Sin espacios ni acentos, ej: mendoza. No lo cambies en obras que ya existen."}
              - {label: "Subtítulo", name: "subtitle", widget: "string", hint: "Ej: reforma integral · interiorismo"}
              - {label: "Año", name: "year", widget: "string", required: false}
              - {label: "Fotografía (créditos)", name: "photographer", widget: "string", required: false}
              - label: "Fotos"
                name: "photos"
                widget: "list"
                summary: "{{fields.width}}"
                fields:
                  - {label: "Imagen", name: "src", widget: "image"}
                  - {label: "Ancho en la ficha", name: "width", widget: "select", options: ["full", "half"], default: "full", hint: "full = ocupa todo el ancho. half = va en pareja con la siguiente foto 'half'."}
